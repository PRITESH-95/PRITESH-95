---------------</tspan></text><text x='418' y='46' xml:space='preserve' font-size='11'><tspan class='k'>. Role:</tspan><tspan class='d'> ..................... </tspan><tspan class='v'>AI/ML + Full-Stack Dev (Freelance)</tspan></text><text x='418' y='60' xml:space='preserve' font-size='11'><tspan class='k'>. Uni:</tspan><tspan class='d'> .................................. </tspan><tspan class='v'>DBATU, AIML (3rd year)</tspan></text><text x='418' y='74' xml:space='preserve' font-size='11'><tspan class='k'>. Location:</tspan><tspan class='d'> .................................. </tspan><tspan class='v'>Aurangabad, India</tspan></text><text x='418' y='88' xml:space='preserve' font-size='11'><tspan class='k'>. OS:</tspan><tspan class='d'> ............................... </tspan><tspan class='v'>Windows + Android (rooted)</tspan></text><text x='418' y='102' xml:space='preserve' font-size='11'><tspan class='k'>. Shell:</tspan><tspan class='d'> ..................... </tspan><tspan class='v'>PowerShell, the mouse is optional</tspan></text><text x='418' y='116' xml:space='preserve' font-size='11'><tspan class='k'>. Uptime:</tspan><tspan class='d'> ........................... </tspan><tspan class='v'>Since print('hello world')</tspan></text><text x='418' y='144' xml:space='preserve' font-size='11'><tspan class='h'>Stack </tspan><tspan class='d'>----------------------------------------------------------</tspan></text><text x='418' y='158' xml:space='preserve' font-size='11'><tspan class='k'>. Languages:</tspan><tspan class='d'> ........ </tspan><tspan class='v'>Python, JavaScript, MicroPython, HTML, CSS</tspan></text><text x='418' y='172' xml:space='preserve' font-size='11'><tspan class='k'>. AI.ML:</tspan><tspan class='d'> ............... </tspan><tspan class='v'>ML, RAG, LLM pipelines, Local inference</tspan></text><text x='418' y='186' xml:space='preserve' font-size='11'><tspan class='k'>. Backend:</tspan><tspan class='d'> ........................... </tspan><tspan class='v'>FastAPI, SQLite, Supabase</tspan></text><text x='418' y='200' xml:space='preserve' font-size='11'><tspan class='k'>. Frontend:</tspan><tspan class='d'> .......................... </tspan><tspan class='v'>React, Vite, Tailwind CSS</tspan></text><text x='418' y='214' xml:space='preserve' font-size='11'><tspan class='k'>. Embedded:</tspan><tspan class='d'> .......... </tspan><tspan class='v'>ESP32, Raspberry Pi Pico, I2S audio, OLED</tspan></text><text x='418' y='228' xml:space='preserve' font-size='11'><tspan class='k'>. Tooling:</tspan><tspan class='d'> ................... </tspan><tspan class='v'>Git, Netlify, Ollama, Groq, Aider</tspan></text><text x='418' y='256' xml:space='preserve' font-size='11'><tspan class='h'>Shipped &amp; Building </tspan><tspan class='d'>---------------------------------------------</tspan></text><text x='418' y='270' xml:space='preserve' font-size='11'><tspan class='k'>. EchoMind:</tspan><tspan class='d'> ............ </tspan><tspan class='v'>Offline ESP32 voice assistant, no cloud</tspan></text><text x='418' y='284' xml:space='preserve' font-size='11'><tspan class='k'>. BidReady AI:</tspan><tspan class='d'> ............ </tspan><tspan class='v'>AI tender-readiness engine for MSMEs</tspan></text><text x='418' y='298' xml:space='preserve' font-size='11'><tspan class='k'>. HousePrice-MLOps:</tspan><tspan class='d'> ...... </tspan><tspan class='v'>India house price prediction pipeline</tspan></text><text x='418' y='312' xml:space='preserve' font-size='11'><tspan class='k'>. qrgen:</tspan><tspan class='d'> ..................... </tspan><tspan class='v'>Installable QR code generator CLI</tspan></text><text x='418' y='326' xml:space='preserve' font-size='11'><tspan class='k'>. PicoSpeedMon:</tspan><tspan class='d'> ............. </tspan><tspan class='v'>Pico + OLED internet speed monitor</tspan></text><text x='418' y='340' xml:space='preserve' font-size='11'><tspan class='k'>. Explore Sambhajinagar:</tspan><tspan class='d'> .......... </tspan><tspan class='v'>Live tourism site on Netlify</tspan></text><text x='418' y='354' xml:space='preserve' font-size='11'><tspan class='k'>. Client Sites:</tspan><tspan class='d'> ............ </tspan><tspan class='v'>Salon + franchise websites, shipped</tspan></text><text x='418' y='382' xml:space='preserve' font-size='11'><tspan class='h'>Contact </tspan><tspan class='d'>--------------------------------------------------------</tspan></text><text x='418' y='396' xml:space='preserve' font-size='11'><tspan class='k'>. GitHub:</tspan><tspan class='d'> ........................................... </tspan><tspan class='v'>PRITESH-95</tspan></text><text x='418' y='410' xml:space='preserve' font-size='11'><tspan class='k'>. LinkedIn:</tspan><tspan class='d'> ........................... </tspan><tspan class='v'>pritesh-shinde-338b67329</tspan></text></svg>